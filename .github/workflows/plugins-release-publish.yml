name: ZTools Plugins Release (Aliyun OSS + CDN)

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'plugins/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '仅执行打包与部署仿真演练 (dry-run)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  publish-plugins:
    name: Build Packages, Index & Deploy to CDN
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Parser Dependencies
        run: |
          if [ -d "frontend" ]; then
            npm --prefix frontend ci || npm --prefix frontend install
          fi

      - name: Run Security AST Scan Gate
        run: |
          echo "🔒 执行正式发布前的 AST 安全终审门禁..."
          node scripts/scan-plugin-security.mjs plugins/

      - name: Package Plugins & Generate Catalog
        id: build-release
        run: |
          echo "📦 打包所有通过审查的插件并生成插件目录 catalog.json / plugins.json..."
          node scripts/build-plugins-release.mjs \
            --plugins-dir plugins \
            --output-dir dist/plugins \
            --cdn-base-url "https://cdn.ztools.cn" \
            --url-prefix plugins-v2

      - name: Upload to Aliyun OSS & Refresh Aliyun CDN
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_REGION: ${{ secrets.OSS_REGION }}
          CDN_ACCESS_KEY_ID: ${{ secrets.CDN_ACCESS_KEY_ID }}
          CDN_ACCESS_KEY_SECRET: ${{ secrets.CDN_ACCESS_KEY_SECRET }}
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "💡 手动选择了演练模式，只打印上传计划，不实际上传"
            DRY_RUN_FLAG="--dry-run"
          fi
          # 没配阿里云密钥时脚本会直接报错，不会假装上传成功
          node scripts/deploy-plugins-storage.mjs \
            --dir dist/plugins \
            --cdn-base-url "https://cdn.ztools.cn" \
            --oss-prefix plugins-v2 \
            $DRY_RUN_FLAG

      - name: Archive Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ztools-plugins-release-bundle
          path: dist/plugins/**
          retention-days: 30

      - name: Generate Release Summary
        run: |
          node -e "
          import fs from 'node:fs';
          const indexPath = 'dist/plugins/catalog.json';
          if (!fs.existsSync(indexPath)) process.exit(0);
          const index = JSON.parse(fs.readFileSync(indexPath, 'utf8'));

          let summary = '### 🚀 ZTools GitOps 插件分发流水线发布成功！\n\n';
          summary += '- **插件目录**: \`' + index.cdnBaseUrl + '/plugins-v2/catalog.json\`\n';
          summary += '- **全网插件总数**: ' + index.total + '\n';
          summary += '- **更新时间**: ' + index.generatedAt + '\n\n';
          summary += '| 插件名称 | 插件 ID | 版本 | 大小 | SHA256 校验和 | 下载直链 |\n';
          summary += '| :--- | :--- | :--- | :--- | :--- | :--- |\n';

          for (const p of index.plugins) {
            summary += '| ' + p.name + ' | ' + p.id + ' | ' + p.version + ' | ' + (p.size / 1024).toFixed(1) + ' KB | \`' + p.sha256.substring(0, 12) + '...\` | [下载](' + p.downloadUrl + ') |\n';
          }

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          "
