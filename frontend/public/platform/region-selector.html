<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>选择截图区域</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:rgba(0,0,0,.12);cursor:crosshair;user-select:none;font:14px system-ui;color:#fff}
#selection{display:none;position:fixed;border:2px solid #fff;box-sizing:border-box;background:rgba(48,145,255,.15);pointer-events:none;box-shadow:0 0 0 1px #2678d7}
#toolbar{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:8px;background:#202630;cursor:default;box-shadow:0 4px 20px #0005}
button{padding:7px 14px;border:1px solid #748091;border-radius:5px;background:#313b49;color:white;cursor:pointer}button:disabled{opacity:.45;cursor:default}
</style><script src="ztools://web/platform/region-selector.js" defer></script></head>
<body><div id="selection"></div><div id="toolbar"><span id="hint" role="status">拖动选择当前屏幕的区域 · Esc 取消</span><button id="confirm" disabled>截取 · Enter</button><button id="cancel">取消</button></div></body></html>
