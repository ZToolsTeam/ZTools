<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DLL 插件调用示例</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
      }

      h1 {
        color: white;
        text-align: center;
        margin-bottom: 30px;
        font-size: 2.5em;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
      }

      .card {
        background: white;
        border-radius: 12px;
        padding: 25px;
        margin-bottom: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }

      .card h2 {
        color: #667eea;
        margin-bottom: 15px;
        font-size: 1.5em;
        border-bottom: 2px solid #667eea;
        padding-bottom: 10px;
      }

      .plugin-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 15px;
        margin-top: 15px;
      }

      .plugin-item {
        background: #f8f9fa;
        border: 2px solid #e9ecef;
        border-radius: 8px;
        padding: 15px;
        transition: all 0.3s;
        cursor: pointer;
      }

      .plugin-item:hover {
        border-color: #667eea;
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        transform: translateY(-2px);
      }

      .plugin-item.selected {
        border-color: #28a745;
        background: #d4edda;
      }

      .plugin-name {
        font-weight: bold;
        color: #667eea;
        font-size: 1.2em;
        margin-bottom: 8px;
      }

      .plugin-badge {
        display: inline-block;
        background: #ffc107;
        color: #000;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 0.8em;
        font-weight: bold;
        margin-left: 8px;
      }

      .plugin-badge.cpp {
        background: #17a2b8;
        color: white;
      }

      .plugin-badge.delphi {
        background: #dc3545;
        color: white;
      }

      .plugin-info {
        font-size: 0.9em;
        color: #6c757d;
        margin-bottom: 5px;
      }

      .plugin-functions {
        margin-top: 10px;
      }

      .function-tag {
        display: inline-block;
        background: #667eea;
        color: white;
        padding: 4px 10px;
        border-radius: 12px;
        font-size: 0.85em;
        margin: 3px;
      }

      .test-section {
        margin-top: 20px;
      }

      .input-group {
        margin-bottom: 15px;
      }

      .input-group label {
        display: block;
        margin-bottom: 5px;
        color: #495057;
        font-weight: 500;
      }

      .input-group input,
      .input-group select {
        width: 100%;
        padding: 10px;
        border: 2px solid #e9ecef;
        border-radius: 6px;
        font-size: 1em;
        transition: border-color 0.3s;
      }

      .input-group input:focus,
      .input-group select:focus {
        outline: none;
        border-color: #667eea;
      }

      .selected-plugin-info {
        background: #e7f3ff;
        border-left: 4px solid #007bff;
        padding: 12px;
        margin-bottom: 15px;
        border-radius: 4px;
      }

      .selected-plugin-info strong {
        color: #007bff;
      }

      .btn {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        padding: 12px 30px;
        border-radius: 6px;
        font-size: 1em;
        font-weight: 500;
        cursor: pointer;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
        margin-right: 10px;
      }

      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
      }

      .btn:active {
        transform: translateY(0);
      }

      .btn-clear {
        background: #6c757d;
      }

      .log-container {
        margin-top: 20px;
        max-height: 600px;
        overflow-y: auto;
        background: #1e1e1e;
        border-radius: 8px;
        padding: 15px;
      }

      .log-entry {
        margin-bottom: 15px;
        padding: 10px;
        background: #2d2d2d;
        border-radius: 4px;
        border-left: 4px solid #667eea;
      }

      .log-entry.request {
        border-left-color: #ffc107;
      }

      .log-entry.response {
        border-left-color: #28a745;
      }

      .log-entry.error {
        border-left-color: #dc3545;
      }

      .log-timestamp {
        color: #6c757d;
        font-size: 0.85em;
        font-family: 'Courier New', monospace;
      }

      .log-title {
        color: #ffc107;
        font-weight: bold;
        margin: 5px 0;
      }

      .log-content {
        color: #d4d4d4;
        font-family: 'Courier New', monospace;
        white-space: pre-wrap;
        word-break: break-all;
        font-size: 0.9em;
        margin-top: 5px;
      }

      .result-box {
        margin-top: 20px;
        padding: 15px;
        background: #f8f9fa;
        border-left: 4px solid #667eea;
        border-radius: 4px;
        font-family: 'Courier New', monospace;
        white-space: pre-wrap;
        word-break: break-all;
      }

      .result-box.success {
        border-left-color: #28a745;
        background: #d4edda;
      }

      .result-box.error {
        border-left-color: #dc3545;
        background: #f8d7da;
      }

      .examples {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 15px;
        margin-top: 15px;
      }

      .example-btn {
        background: white;
        border: 2px solid #667eea;
        color: #667eea;
        padding: 12px;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.3s;
        font-weight: 500;
      }

      .example-btn:hover {
        background: #667eea;
        color: white;
      }

      .loading {
        display: inline-block;
        width: 20px;
        height: 20px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top-color: white;
        animation: spin 1s ease-in-out infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🔌 DLL 插件调用测试工具</h1>

      <!-- 插件列表 -->
      <div class="card">
        <h2>📋 已加载的 DLL 插件（点击选择）</h2>
        <button class="btn" onclick="loadPlugins()">🔄 刷新插件列表</button>
        <div id="pluginList" class="plugin-list"></div>
      </div>

      <!-- 测试区域 -->
      <div class="card">
        <h2>🧪 测试调用</h2>
        <div class="test-section">
          <div
            id="selectedPluginInfo"
            class="selected-plugin-info"
            style="display: none"
          >
            <strong>当前选择：</strong>
            <span id="currentPluginName"></span>
            <span id="currentPluginBadge"></span>
          </div>

          <div class="input-group">
            <label>函数名称</label>
            <select id="funcName">
              <option value="">请先选择插件</option>
            </select>
          </div>
          <div class="input-group">
            <label>参数 (JSON 格式)</label>
            <input
              type="text"
              id="params"
              value='{"a": 10, "b": 20}'
              placeholder='{"a": 10, "b": 20}'
            />
          </div>
          <button class="btn" onclick="callPlugin()">▶️ 调用插件</button>
          <button class="btn btn-clear" onclick="clearLogs()">
            🗑️ 清空日志
          </button>
          <div id="result"></div>
        </div>
      </div>

      <!-- 请求/响应日志 -->
      <div class="card">
        <h2>📜 请求/响应日志</h2>
        <div id="logContainer" class="log-container">
          <div style="color: #6c757d; text-align: center; padding: 20px">
            暂无日志记录
          </div>
        </div>
      </div>

      <!-- 快速示例 -->
      <div class="card">
        <h2>⚡ 快速示例</h2>
        <div id="quickExamples" class="examples">
          <p style="color: #6c757d">请先选择插件以查看快速示例</p>
        </div>
      </div>
    </div>

    <script src="../js/cef-ipc/dist/ztools-api.js"></script>
    <script src="../js/dll-plugin-sdk.js"></script>
    <script>
      let currentPlugin = null
      let pluginsList = []
      let logCounter = 0

      // 添加日志
      function addLog(type, title, content, timestamp = new Date()) {
        const logContainer = document.getElementById('logContainer')

        // 清空"暂无日志"提示
        if (logCounter === 0) {
          logContainer.innerHTML = ''
        }

        logCounter++

        const logEntry = document.createElement('div')
        logEntry.className = `log-entry ${type}`
        logEntry.innerHTML = `
                <div class="log-timestamp">[${timestamp.toLocaleTimeString()}.${timestamp.getMilliseconds()}]</div>
                <div class="log-title">${title}</div>
                <div class="log-content">${content}</div>
            `

        logContainer.insertBefore(logEntry, logContainer.firstChild)
      }

      // 清空日志
      function clearLogs() {
        const logContainer = document.getElementById('logContainer')
        logContainer.innerHTML =
          '<div style="color: #6c757d; text-align: center; padding: 20px;">暂无日志记录</div>'
        logCounter = 0
      }

      // 获取插件类型标识
      function getPluginType(name) {
        if (
          name.toLowerCase().includes('cplus') ||
          name.toLowerCase().includes('cpp')
        ) {
          return { type: 'cpp', label: 'C++' }
        } else if (name.toLowerCase().includes('delphi')) {
          return { type: 'delphi', label: 'Delphi' }
        } else {
          return { type: 'unknown', label: '未知' }
        }
      }

      // 加载插件列表
      async function loadPlugins() {
        const container = document.getElementById('pluginList')
        container.innerHTML = '<p>加载中...</p>'

        const startTime = new Date()
        addLog(
          'request',
          '📤 请求：获取插件列表',
          'window.ztools.dllplugin.list()',
          startTime
        )

        try {
          pluginsList = await window.ztools.dllplugin.list()

          const endTime = new Date()
          addLog(
            'response',
            '📥 响应：插件列表',
            JSON.stringify(pluginsList, null, 2),
            endTime
          )

          if (pluginsList.length === 0) {
            container.innerHTML =
              '<p style="color: #6c757d;">未找到 DLL 插件</p>'
            return
          }

          container.innerHTML = ''
          pluginsList.forEach((plugin) => {
            const pluginType = getPluginType(plugin.name)
            const item = document.createElement('div')
            item.className = 'plugin-item'
            item.onclick = () => selectPlugin(plugin)
            item.innerHTML = `
                        <div class="plugin-name">
                            ${plugin.name}
                            <span class="plugin-badge ${pluginType.type}">${pluginType.label}</span>
                        </div>
                        <div class="plugin-info">版本: ${plugin.version}</div>
                        <div class="plugin-info">作者: ${plugin.author}</div>
                        <div class="plugin-info">${plugin.description}</div>
                        <div class="plugin-functions">
                            ${plugin.functions.map((f) => `<span class="function-tag">${f}</span>`).join('')}
                        </div>
                    `
            container.appendChild(item)
          })
        } catch (error) {
          const endTime = new Date()
          addLog(
            'error',
            '❌ 错误：加载插件列表失败',
            error.message || String(error),
            endTime
          )
          container.innerHTML = `<p style="color: #dc3545;">加载失败: ${error.message}</p>`
        }
      }

      // 选择插件
      function selectPlugin(plugin) {
        currentPlugin = plugin

        // 更新选中状态
        document.querySelectorAll('.plugin-item').forEach((item) => {
          item.classList.remove('selected')
        })
        event.currentTarget.classList.add('selected')

        // 显示当前选择
        const pluginType = getPluginType(plugin.name)
        document.getElementById('selectedPluginInfo').style.display = 'block'
        document.getElementById('currentPluginName').textContent = plugin.name
        document.getElementById('currentPluginBadge').innerHTML =
          `<span class="plugin-badge ${pluginType.type}">${pluginType.label}</span>`

        // 更新函数列表
        const funcSelect = document.getElementById('funcName')
        funcSelect.innerHTML = plugin.functions
          .map((func) => `<option value="${func}">${func}</option>`)
          .join('')

        // 更新快速示例
        updateQuickExamples(plugin)

        addLog(
          'request',
          '✅ 选择插件',
          `插件名称: ${plugin.name}\n类型: ${pluginType.label}\n函数数量: ${plugin.functions.length}`
        )
      }

      // 更新快速示例
      function updateQuickExamples(plugin) {
        const container = document.getElementById('quickExamples')
        const examples = [
          { func: 'Add', params: { a: 100, b: 200 }, label: '加法: 100 + 200' },
          {
            func: 'Subtract',
            params: { a: 100, b: 50 },
            label: '减法: 100 - 50'
          },
          {
            func: 'Multiply',
            params: { a: 12, b: 34 },
            label: '乘法: 12 × 34'
          },
          { func: 'Divide', params: { a: 100, b: 5 }, label: '除法: 100 ÷ 5' },
          {
            func: 'Power',
            params: { base: 2, exponent: 10 },
            label: '幂运算: 2^10'
          },
          { func: 'Sqrt', params: { value: 144 }, label: '平方根: √144' },
          { func: 'Factorial', params: { n: 10 }, label: '阶乘: 10!' },
          { func: 'Fibonacci', params: { n: 10 }, label: '斐波那契: F(10)' },
          { func: 'Divide', params: { a: 100, b: 0 }, label: '除零测试 (错误)' }
        ]

        const availableExamples = examples.filter((ex) =>
          plugin.functions.includes(ex.func)
        )

        if (availableExamples.length === 0) {
          container.innerHTML =
            '<p style="color: #6c757d;">此插件暂无预设示例</p>'
          return
        }

        container.innerHTML = availableExamples
          .map(
            (ex) =>
              `<button class="example-btn" onclick='runExample("${ex.func}", ${JSON.stringify(ex.params)})'>${ex.label}</button>`
          )
          .join('')
      }

      // 调用插件
      async function callPlugin() {
        if (!currentPlugin) {
          alert('请先选择一个插件')
          return
        }

        const funcName = document.getElementById('funcName').value
        const paramsText = document.getElementById('params').value
        const resultDiv = document.getElementById('result')

        try {
          const params = JSON.parse(paramsText)
          resultDiv.innerHTML = '<div class="result-box">调用中...</div>'

          const startTime = new Date()
          const requestData = {
            plugin: currentPlugin.name,
            function: funcName,
            params: params
          }
          addLog(
            'request',
            '📤 请求：调用插件函数',
            `插件: ${currentPlugin.name}\n函数: ${funcName}\n参数: ${JSON.stringify(params, null, 2)}`,
            startTime
          )

          const result = await window.ztools.dllplugin.call(
            currentPlugin.name,
            funcName,
            params
          )

          const endTime = new Date()
          const duration = endTime - startTime
          addLog(
            'response',
            `📥 响应：调用成功 (${duration}ms)`,
            JSON.stringify(result, null, 2),
            endTime
          )

          resultDiv.innerHTML = `
                    <div class="result-box success">
                        <strong>✅ 调用成功 (耗时: ${duration}ms)</strong><br>
                        插件: ${currentPlugin.name}<br>
                        函数: ${funcName}<br>
                        结果: ${JSON.stringify(result, null, 2)}
                    </div>
                `
        } catch (error) {
          const endTime = new Date()
          addLog(
            'error',
            '❌ 错误：调用失败',
            `插件: ${currentPlugin.name}\n函数: ${funcName}\n错误: ${error.message || String(error)}`,
            endTime
          )

          resultDiv.innerHTML = `
                    <div class="result-box error">
                        <strong>❌ 调用失败</strong><br>
                        插件: ${currentPlugin.name}<br>
                        函数: ${funcName}<br>
                        错误: ${error.message || String(error)}
                    </div>
                `
        }
      }

      // 运行示例
      async function runExample(func, params) {
        document.getElementById('funcName').value = func
        document.getElementById('params').value = JSON.stringify(params)
        await callPlugin()
      }

      // 页面加载时自动加载插件列表
      window.addEventListener('load', () => {
        loadPlugins()
      })
    </script>
  </body>
</html>
